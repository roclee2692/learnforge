[project]
name = "learnforge"
version = "0.1.0"
description = "AI 驱动的长期学习系统：引擎层（判分、验算、排期、统计）"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
book = ["pypdf>=4"]

[project.scripts]
lf = "learnforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnforge"]
